# Firewall rules
# Rules are evaluated TOP TO BOTTOM. The FIRST matching rule wins.
# If no rule matches, the default policy is applied.
#
# Format:  id | type | condition | action | enabled
#   type      : KEYWORD (message contains text, case-insensitive)
#               IP      (client IP address equals condition)
#   action    : ALLOW or BLOCK
#   enabled   : true or false

default = ALLOW

1 | KEYWORD | BLOCKED      | BLOCK | true
2 | IP      | 192.168.1.20 | BLOCK | true
3 | IP      | 127.0.0.1    | ALLOW | true
